# Every 30 min: read M&S stock and deploy the map to GitHub Pages.
# If the poll fails the job stops before deploying, so the site keeps the last good stock.json.
name: Poll stock

on:
  # GitHub's scheduler is best-effort and drops runs at busy times; :00 and :30 are the busiest slots.
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  # The schedule is a backup for cron-job.org: it only polls when no dispatch/push run has started in 25 min,
  # so a missed cron-job.org slot gets filled without doubling load on M&S.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w poll.yml -L 20 --json databaseId,event,conclusion,createdAt \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.event == \"workflow_dispatch\" or .event == \"push\") and .conclusion != \"failure\" and .conclusion != \"cancelled\")][0].createdAt")
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "Last dispatch/push run started ${age}s ago"
          if [ "$age" -gt 1500 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  poll:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run pytest -q
      - id: pages
        uses: actions/configure-pages@v5
      # SITE_URL: the poll adds to the history the live site already has.
      - run: uv run python -m scripts.poll
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # The runner image ships Google Chrome; installing Playwright's browser via apt can take 10+ minutes.
          BROWSER_CHANNEL: chrome
      # The store list refreshes weekly; keep it so the next run doesn't re-fetch it.
      # Retries a push race; never blocks the deploy (the next run just re-fetches the list).
      - name: Save store list
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh M&S store list"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      # Link previews need an absolute image URL.
      - run: sed -i 's|content="og.png"|content="${{ steps.pages.outputs.base_url }}/og.png"|' public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # Pages sometimes returns a 500 on deploy; one retry a minute later.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

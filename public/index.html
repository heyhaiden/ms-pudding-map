<script>

// consent banner is needed; the cost is that a returning visitor counts as new. Events before load are queued.
window.track = (() => {
  const queue = [];
  let ready = false;
  if (location.hostname.endsWith("github.io") || new URLSearchParams(location.search).has("analytics")) {
    const script = document.createElement("script");
    script.async = true;
    script.src = "https://us-assets.i.posthog.com/static/array.js";
    script.onload = () => {
      posthog.init("phc_pLYVNcYd6dP3aMZ5PwE8KkJkG9L7RNCS8tRhx8XUbqQc", { api_host: "https://us.i.posthog.com",
        persistence: "memory", person_profiles: "identified_only", capture_pageview: true, capture_pageleave: true });
      ready = true;
      queue.splice(0).forEach(([event, props]) => posthog.capture(event, props));
    };
    document.head.append(script);
  }
  return (event, props) => (ready ? posthog.capture(event, props) : queue.push([event, props]));
})();

<style>
  /* Colours from the tub: mustard label, magenta lettering, chocolate pudding, cream pot, caramel drizzle. */
  :root {
    --mustard: #F6C344; --magenta: #B5328C; --chocolate: #3B2216; --cream: #F3E6D3; --caramel: #C9802F;
    --in: #1F9D5A; --low: #E8891C; --out: #D23A4E; --unknown: #8C7B70; --not_sold: #9A8473;
    --card: var(--mustard); --ink: var(--chocolate); --headline: var(--magenta); --chip: rgba(255,255,255,.55);
    --land: #F3E6D3; --water: #EBC6DD; --page: #F3E6D3; --shadow: 0 4px 0 var(--chocolate); --stroke: #3B2216;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --card: #2B1910; --ink: #F3E6D3; --headline: #F6C344; --chip: rgba(255,255,255,.08);
      --land: #241812; --water: #3A2233; --page: #241812; --not_sold: #8C7B70; --shadow: 0 4px 0 #000;
      --stroke: #F3E6D3;
    }
  }
  /* Same dark palette when the viewer picks it with the toggle. */
  :root[data-theme="dark"] {
    --card: #2B1910; --ink: #F3E6D3; --headline: #F6C344; --chip: rgba(255,255,255,.08);
    --land: #241812; --water: #3A2233; --page: #241812; --not_sold: #8C7B70; --shadow: 0 4px 0 #000;
    --stroke: #F3E6D3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink);
    font: 15px/1.45 "DM Sans", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  #map { position: fixed; inset: 0; animation: fade .6s ease-out both; }
  @keyframes fade { from { opacity: 0; } }
  button, a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; }

  .card { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; width: min(380px, calc(100% - 32px));
    padding: 18px 20px 16px; background: var(--card); color: var(--ink); border: 3px solid var(--chocolate);
    border-radius: 22px; box-shadow: var(--shadow); }
  .eyebrow { margin: 0; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .live { display: inline-block; width: 9px; height: 9px; margin: 0 8px 1px 0; border-radius: 50%;
    background: var(--out); box-shadow: 0 0 0 0 var(--out); animation: live 1.6s ease-out infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(210,58,78,.7); } 100% { box-shadow: 0 0 0 9px rgba(210,58,78,0); } }
  h1 { margin: 2px 0 0; font: 400 34px/0.95 "Bagel Fat One", "DM Sans", sans-serif; color: var(--headline);
    letter-spacing: .01em; }
  h1 a { color: inherit; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .answer { margin: 10px 0 2px; font: 400 52px/1 "Bagel Fat One", "DM Sans", sans-serif; color: var(--ink); }
  .headline { margin: 0 0 14px; font-size: 15px; }
  .headline b { font-weight: 700; }

  .actions { display: flex; gap: 8px; margin: 0 0 14px; }
  .btn { flex: 1; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    padding: 0 14px; border: 3px solid var(--chocolate); border-radius: 999px; font: 700 14px "DM Sans", sans-serif;
    cursor: pointer; box-shadow: 0 3px 0 var(--chocolate); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--chocolate); }
  .btn .icon { width: 18px; height: 18px; flex: none; }
  .btn.primary { flex: 1.5; background: var(--magenta); color: #fff; }
  .btn.secondary { background: #fff; color: var(--chocolate); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .legend button { display: flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 11px;
    border: 2px solid transparent; border-radius: 999px; background: var(--chip); color: var(--ink);
    font: 600 13px "DM Sans", sans-serif; cursor: pointer; }
  .legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
  .legend .n { font-variant-numeric: tabular-nums; opacity: .7; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--chocolate); flex: none; }
  .dot.ring { background: transparent !important; border-color: var(--not_sold); }

  .meta { margin: 12px 0 0; font-size: 12px; opacity: .8; }
  .meta a { color: inherit; }
  .stale { color: var(--out); font-weight: 700; }
  .dev { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 6; display: flex; gap: 6px;
    align-items: center; padding: 4px 10px; border-radius: 999px; background: #111; color: #0f0;
    font: 600 11px ui-monospace, monospace; cursor: pointer; opacity: .85; }
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    padding: 10px 16px; background: var(--chocolate); color: var(--cream); border-radius: 999px; font-weight: 600;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 5; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .mapboxgl-popup-content { font: inherit; color: var(--chocolate); background: #fff; border: 3px solid var(--chocolate);
    border-radius: 16px; padding: 12px 16px 12px 14px; box-shadow: 0 3px 0 var(--chocolate), 0 12px 24px rgba(59,34,22,.25); }
  .mapboxgl-popup-tip { display: none; }
  .mapboxgl-popup-close-button { font-size: 18px; padding: 2px 8px; color: var(--chocolate); }
  .pop h2 { margin: 0 22px 6px 0; font: 400 19px/1.1 "Bagel Fat One", sans-serif; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 12px; }
  .pill.not_sold, .pill.unknown { background: var(--cream) !important; color: var(--chocolate); }
  .pop p { margin: 6px 0 0; font-size: 13px; }
  .pop a { color: var(--magenta); font-weight: 700; }
  /* History: 7 days (rows) by 24 hours (columns), like a status page. */
  .week { margin: 10px 0 0; }
  .week summary { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; font-size: 11px;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--magenta); cursor: pointer;
    list-style: none; }
  .week summary::-webkit-details-marker { display: none; }
  .week summary::before { content: "▸"; font-size: 12px; transition: transform .15s; }
  .week details[open] summary::before { transform: rotate(90deg); }
  .week details[open] .grid { margin: 4px 0 6px; }
  .grid { display: grid; grid-template-columns: 28px repeat(24, 7px); gap: 3px 2px; align-items: center; }
  .grid .day { font-size: 11px; font-weight: 600; opacity: .7; }
  .grid .c { height: 16px; border-radius: 3px; background: #EDE3D6; }
  .week .slide { overflow: hidden; }
  .grid .c.I { background: var(--in); } .grid .c.L { background: var(--low); } .grid .c.O { background: var(--out); }
  .grid .hours { grid-column: 2 / -1; display: flex; justify-content: space-between; font-size: 9px; opacity: .6; }
  .week .facts { margin: 0 0 2px; font-size: 12px; }
  .trend { margin: 12px 0 0; }
  .trend svg { display: block; width: 100%; height: 34px; overflow: visible; }
  .trend p { margin: 4px 0 0; font-size: 12px; opacity: .85; }

  .more { overflow: hidden; }
  .mode { position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 2; width: 48px; height: 48px;
    padding: 11px; border: 3px solid var(--chocolate); border-radius: 50%; background: var(--card); color: var(--ink);
    box-shadow: 0 3px 0 var(--chocolate); cursor: pointer; }
  .mode svg { width: 20px; height: 20px; display: block; }
  .fold { display: none; position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; padding: 10px;
    border: 0; border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer; z-index: 1; }
  .fold svg { width: 24px; height: 24px; display: block; transition: transform .25s; }
  .card.folded .fold svg { transform: rotate(180deg); }
  .card.folded .more { display: none; }
  @media (max-width: 720px) {
    .fold { display: block; }
    /* Phones: the card spans the top, so the toggle sits inside it, left of the minimise button. */
    .mode { position: absolute; top: 6px; right: 50px; width: 44px; height: 44px; padding: 12px; border: 0;
      background: transparent; box-shadow: none; }
    .card.folded h1 { font-size: 22px; }
    .card.folded .answer { font-size: 30px; margin: 4px 0 0; }
  }
  @media (max-width: 520px) {
    .card { padding: 14px 16px 12px; border-radius: 18px; }
    h1 { font-size: 26px; }
    .answer { font-size: 40px; margin-top: 6px; }
    .headline { margin-bottom: 10px; font-size: 14px; }
    .actions { margin-bottom: 10px; }
    .btn { min-height: 40px; font-size: 13px; padding: 0 10px; }
    .legend button { min-height: 28px; padding: 0 9px; font-size: 12px; }
    .meta { margin-top: 8px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { .btn, .toast, .week summary::before, .fold svg { transition: none; } .live { animation: none; } }
</style>

<body>
<div id="map" role="region" aria-label="Map of M&S stores around London and pudding stock"></div>
<main class="card" aria-live="polite">
  <button class="mode" id="mode" type="button"></button>
  <button class="fold" id="fold" type="button" aria-expanded="true" aria-controls="more" aria-label="Minimise">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor"
      stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <p class="eyebrow"><span class="live" aria-hidden="true"></span>Live</p>
  <h1>Is <a id="product" href="https://www.marksandspencer.com/food/banana-caramel-and-pecan-pudding/p/fdp61273052"
    target="_blank" rel="noopener">the Pudding</a> In?</h1>
  <p class="answer" id="answer">…</p>
  <div class="more" id="more">
  <p class="headline" id="headline">Checking every M&S…</p>
  <div class="actions">
    <button class="btn primary" id="nearest" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.8 8.2 13.6 13.6 8.2 15.8 10.4 10.4Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> Nearest pudding</button>
    <button class="btn secondary" id="share" type="button">Share</button>
  </div>
  <ul class="legend" id="legend" aria-label="Show or hide stores by stock"></ul>
  <div class="trend" id="trend" hidden></div>
  <p class="meta"><span id="updated"></span> · Unofficial fan map, not affiliated with M&S</p>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const STATUSES = [
  ["in", "In stock"], ["low", "Going fast"], ["out", "Sold out"], ["not_sold", "Not sold here"],
  ["unknown", "No reading"],
];
const LABEL = Object.fromEntries(STATUSES);
const QUIP = {
  in: "Pudding confirmed. Go go go.",
  low: "Only a few left. Run.",
  out: "Pudding-less. Thoughts and prayers.",
  not_sold: "This M&S doesn't stock it.",
  unknown: "M&S isn't saying. Mystery pudding.",
};
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
const shown = new Set(STATUSES.map(([k]) => k));
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let data, mapReady = false;

const $ = (id) => document.getElementById(id);

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hours = Math.round(mins / 60);
  return hours + (hours === 1 ? " hour ago" : " hours ago");
}

function verdict(have, pct) {
  if (have === 0) return "NOPE.";
  if (pct < 15) return "BARELY.";
  if (pct < 50) return "SORT OF.";
  return "YES!";
}

function stats() {
  const c = data.counts, sold = c.in + c.low + c.out + c.unknown, have = c.in + c.low;
  return { c, sold, have, pct: sold ? Math.round(100 * have / sold) : 0 };
}

function render() {
  const { c, sold, have, pct } = stats();
  $("product").href = data.product.url;
  $("answer").textContent = verdict(have, pct);
  $("headline").innerHTML = `<b>${have}</b> of ${sold} M&S stores that sell it have it right now.`;
  const updated = $("updated");
  updated.textContent = "Updated " + ago(data.updated);
  updated.className = Date.now() - new Date(data.updated) > 2 * 3600e3 ? "stale" : "";
  $("legend").innerHTML = STATUSES.filter(([k]) => k !== "unknown" || c.unknown).map(([key, label]) =>
    `<li><button type="button" data-status="${key}" aria-pressed="${shown.has(key)}">
       <span class="dot${key === "not_sold" ? " ring" : ""}" style="background:var(--${key})"></span>
       ${label} <span class="n">${c[key]}</span></button></li>`).join("");
  if (!mapReady) return;
  const geojson = { type: "FeatureCollection", features: data.stores.map((s) => ({
    type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] }, properties: s })) };
  const source = map.getSource("stores");
  if (source) source.setData(geojson); else addLayers(geojson);
  filter();
}

function addLayers(geojson) {
  map.addSource("stores", { type: "geojson", data: geojson });
  const colour = ["match", ["get", "status"], ...STATUSES.flatMap(([k]) => [k, css(k)]), "#888"];
  // A soft glow behind in-stock stores, pulsing unless the viewer prefers reduced motion.
  map.addLayer({ id: "glow", type: "circle", source: "stores", filter: ["==", ["get", "status"], "in"], paint: {
    "circle-color": css("in"), "circle-opacity": 0.25, "circle-blur": 0.4,
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 12, 13, 22] } });
  map.addLayer({ id: "not_sold", type: "circle", source: "stores", filter: ["==", ["get", "status"], "not_sold"], paint: {
    "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": css("not_sold"), "circle-stroke-width": 2,
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 3.5, 13, 7] } });
  map.addLayer({ id: "stores", type: "circle", source: "stores", filter: ["!=", ["get", "status"], "not_sold"], paint: {
    "circle-color": colour, "circle-stroke-color": css("stroke"), "circle-stroke-width": 2,
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 8,
      ["match", ["get", "status"], "in", 8, "low", 7, 5.5], 13, ["match", ["get", "status"], "in", 14, "low", 12, 9]] },
    layout: { "circle-sort-key": ["match", ["get", "status"], "in", 4, "low", 3, "out", 2, 1] } });
  // Layer events and the pulse outlive a style swap (light/dark), so wire them once.
  if (addLayers.wired) return;
  addLayers.wired = true;
  for (const layer of ["stores", "not_sold"]) {
    map.on("click", layer, (e) => {
      const s = e.features[0].properties;
      track("store_opened", { store: s.name, status: s.status });
      openStore(s, e.features[0].geometry.coordinates);
    });
    map.on("mouseenter", layer, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
  }
  if (!reducedMotion) pulse();
}

function pulse() {
  requestAnimationFrame(pulse);
  if (!map.getLayer("glow")) return;
  const t = (performance.now() % 1800) / 1800;
  map.setPaintProperty("glow", "circle-opacity", 0.35 * (1 - t));
  map.setPaintProperty("glow", "circle-radius", ["interpolate", ["linear"], ["zoom"], 8, 8 + 12 * t, 13, 14 + 20 * t]);
}

let popup;
function openStore(s, coordinates, extra = "") {
  const box = document.createElement("div");
  box.className = "pop";
  const name = document.createElement("h2");
  name.textContent = s.name;
  const pill = document.createElement("span");
  pill.className = "pill " + s.status;
  pill.style.background = css(s.status);
  pill.textContent = LABEL[s.status];
  const quip = document.createElement("p");
  quip.textContent = (extra ? extra + " " : "") + QUIP[s.status];
  const directions = document.createElement("p");
  const link = document.createElement("a");
  link.href = `https://www.google.com/maps/dir/?api=1&destination=${coordinates[1]},${coordinates[0]}`;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = "Directions →";
  directions.append(link);
  box.append(name, pill, quip, week(s), directions);
  popup?.remove();
  // Phones: the card covers the top, so slide the store just below it and open the popup underneath the dot.
  const phone = innerWidth <= 720;
  if (phone) {
    const top = card.getBoundingClientRect().bottom;
    map.easeTo({ center: coordinates, padding: { top, bottom: Math.max(0, innerHeight - top - 80), left: 0, right: 0 },
      duration: reducedMotion ? 0 : 400 });
  }
  popup = new mapboxgl.Popup({ offset: 24, maxWidth: "280px", anchor: phone ? "top" : undefined })
    .setLngLat(coordinates).setDOMContent(box).addTo(map);
}

function filter() {
  if (!mapReady || !map.getLayer("stores")) return;
  const visible = ["in", ["get", "status"], ["literal", [...shown]]];
  map.setFilter("stores", ["all", ["!=", ["get", "status"], "not_sold"], visible]);
  map.setFilter("glow", ["all", ["==", ["get", "status"], "in"], visible]);
  map.setFilter("not_sold", ["all", ["==", ["get", "status"], "not_sold"], visible]);
}

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 2600);
}

function miles(a, b) {
  const rad = Math.PI / 180, dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;
  return 3958.8 * 2 * Math.asin(Math.sqrt(h));
}

let you;
$("nearest").addEventListener("click", () => {
  if (!data) return;
  track("nearest_clicked");
  if (!navigator.geolocation) return toast("Your browser can't share your location.");
  toast("Finding you…");
  navigator.geolocation.getCurrentPosition((pos) => {
    const here = [pos.coords.longitude, pos.coords.latitude];
    const options = data.stores.filter((s) => s.status === "in" || s.status === "low")
      .map((s) => ({ s, d: miles(here, [s.lng, s.lat]) })).sort((a, b) => a.d - b.d);
    you?.remove();
    you = new mapboxgl.Marker({ color: css("magenta") }).setLngLat(here).addTo(map);
    if (!options.length) {
      track("nearest_result", { found: false });
      return toast("No pudding anywhere nearby right now. 😭");
    }
    const { s, d } = options[0];
    track("nearest_result", { found: true, store: s.name, status: s.status, miles: +d.toFixed(1) });
    const coords = [s.lng, s.lat];
    map.fitBounds([here, coords], { padding: { top: 260, bottom: 80, left: 60, right: 60 }, maxZoom: 15,
      duration: reducedMotion ? 0 : 1200 });
    openStore(s, coords, `${d < 0.1 ? "Right here" : d.toFixed(1) + " mi away"}.`);
  }, (error) => {
    track("nearest_result", { found: false, location_error: error.code });
    toast("Couldn't get your location.");
  }, { enableHighAccuracy: true, timeout: 10000 });
});

$("share").addEventListener("click", async () => {
  const text = data
    ? `Only ${stats().have} of ${stats().sold} M&S stores around London have the banana, caramel & pecan pudding right now 🍮`
    : "Is the M&S banana, caramel & pecan pudding in? 🍮";
  const url = location.href.split("#")[0];
  try {
    if (navigator.share) {
      track("share", { method: "native" });
      return await navigator.share({ title: "Is the Pudding In?", text, url });
    }
    await navigator.clipboard.writeText(`${text} ${url}`);
    track("share", { method: "copy" });
    toast("Link copied. Spread the pudding word.");
  } catch (error) {
    if (error.name !== "AbortError") toast("Couldn't share. Copy the address bar instead.");
  }
});

// Phones: fold the card down to the verdict so more map shows. Remembered per viewer.
function fold(folded, animate = true) {
  const cardEl = document.querySelector(".card"), more = $("more"), button = $("fold");
  button.setAttribute("aria-expanded", String(!folded));
  button.setAttribute("aria-label", folded ? "Expand" : "Minimise");
  try { localStorage.setItem("card-folded", folded ? "1" : ""); } catch {}
  if (!animate || reducedMotion) return cardEl.classList.toggle("folded", folded);
  const full = more.scrollHeight + "px";
  if (folded) {
    more.animate({ height: [full, "0px"], opacity: [1, 0] }, { duration: 260, easing: "cubic-bezier(.2,.8,.2,1)" })
      .onfinish = () => cardEl.classList.add("folded");
  } else {
    cardEl.classList.remove("folded");
    more.animate({ height: ["0px", more.scrollHeight + "px"], opacity: [0, 1] },
      { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" });
  }
}
$("product").addEventListener("click", () => track("product_link_clicked"));
$("fold").addEventListener("click", () => {
  const folded = !document.querySelector(".card").classList.contains("folded");
  track("card_folded", { folded });
  fold(folded);
});
try { if (innerWidth <= 720 && localStorage.getItem("card-folded")) fold(true, false); } catch {}

$("legend").addEventListener("click", (e) => {
  const button = e.target.closest("button");
  if (!button) return;
  const key = button.dataset.status;
  shown.has(key) ? shown.delete(key) : shown.add(key);
  track("filter_toggled", { status: key, shown: shown.has(key) });
  button.setAttribute("aria-pressed", shown.has(key));
  filter();
});

// ----- History: one letter per store per 30-minute slot (scripts/history.py) -----
let history;
// The 7-day grid in store popups: hidden on the live site. Dev (localhost, or any URL with ?dev) gets a switch for it.
const DEV = ["127.0.0.1", "localhost"].includes(location.hostname) || new URLSearchParams(location.search).has("dev");
let SHOW_WEEK_GRID = false;
try { SHOW_WEEK_GRID = DEV && localStorage.getItem("dev-week-grid") === "1"; } catch {}
if (DEV) {
  const panel = document.createElement("label");
  panel.className = "dev";
  panel.innerHTML = `<input type="checkbox" ${SHOW_WEEK_GRID ? "checked" : ""}> DEV · 7-day grid`;
  panel.querySelector("input").addEventListener("change", (e) => {
    SHOW_WEEK_GRID = e.target.checked;
    try { localStorage.setItem("dev-week-grid", SHOW_WEEK_GRID ? "1" : ""); } catch {}
    popup?.remove();
  });
  document.body.append(panel);
}
const SLOT_MS = 30 * 60 * 1000, WEEK = 7 * 48;
const RANK = { I: 4, L: 3, O: 2, U: 1, N: 1, "-": 0 };
const londonParts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", weekday: "short", year: "numeric",
  month: "2-digit", day: "2-digit", hour: "numeric", hourCycle: "h23" });
function london(date) {
  const p = Object.fromEntries(londonParts.formatToParts(date).map((x) => [x.type, x.value]));
  return { key: `${p.year}-${p.month}-${p.day}`, day: p.weekday, hour: +p.hour };
}
const slotDate = (i) => new Date(+new Date(history.start) + i * SLOT_MS);
const has = (code) => code === "I" || code === "L";

function when(date) {
  const t = london(date), today = london(new Date()).key;
  const h = t.hour % 12 || 12, ampm = t.hour < 12 ? "am" : "pm";
  return (t.key === today ? "today" : t.day) + " " + h + ampm;
}

// The last 7 days for one store: a 7x24 grid of the best reading each hour, plus a few facts.
function week(s) {
  const line = history?.stores?.[s.id];
  const box = document.createElement("div");
  box.className = "week";
  if (!line || s.status === "not_sold") return box;
  const first = Math.max(0, line.length - WEEK);
  const cells = new Map();
  let known = 0, yes = 0, last = -1;
  for (let i = first; i < line.length; i++) {
    const code = line[i], t = london(slotDate(i)), key = t.key + "|" + t.hour;
    if (RANK[code] > (RANK[cells.get(key)] ?? -1)) cells.set(key, code);
    if (code !== "-" && code !== "N") known++;
    if (has(code)) { yes++; last = i; }
  }
  for (let i = first - 1; i >= 0 && last < 0; i--) if (has(line[i])) last = i;
  const days = [];
  for (let d = 6; d >= 0; d--) days.push(london(new Date(Date.now() - d * 864e5)));
  const grid = days.map((d) => `<span class="day">${d.day}</span>` + Array.from({ length: 24 }, (_, h) => {
    const code = cells.get(d.key + "|" + h) || "";
    return `<span class="c ${code}"></span>`;
  }).join("")).join("") + `<span class="hours"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></span>`;
  // A percentage needs a day of readings; until then the grid speaks for itself.
  const facts = known < 48 ? "" : `Had it ${Math.round(100 * yes / known)}% of the time this week.` +
    (last >= 0 ? ` Last seen ${when(slotDate(last))}.` : " Not seen this week.");
  // The grid is tucked away until asked for.
  box.innerHTML = (facts ? '<p class="facts"></p>' : "") + (SHOW_WEEK_GRID ? `<details><summary>Last 7 days</summary>
    <div class="slide"><div class="grid" role="img" aria-label="Stock by hour for the last 7 days">${grid}</div></div>
    </details>` : "");
  if (facts) box.querySelector(".facts").textContent = facts;
  const details = box.querySelector("details");
  details?.querySelector("summary").addEventListener("click", (e) => { e.preventDefault(); slide(details); });
  return box;
}

// Slide the grid open or shut, then nudge the map if the taller popup ran off screen.
function slide(details) {
  const panel = details.querySelector(".slide");
  const opening = !details.open;
  if (opening) details.open = true;
  const full = panel.scrollHeight + "px";
  const animation = panel.animate(
    { height: opening ? ["0px", full] : [full, "0px"], opacity: opening ? [0, 1] : [1, 0] },
    { duration: reducedMotion ? 0 : 320, easing: "cubic-bezier(.2, .8, .2, 1)" });
  animation.onfinish = () => {
    if (!opening) details.open = false;
    const rect = popup?.getElement().getBoundingClientRect();
    if (!rect) return;
    const nudge = rect.top < 8 ? rect.top - 8 : rect.bottom > innerHeight - 8 ? rect.bottom - innerHeight + 8 : 0;
    if (nudge) map.panBy([0, nudge], { duration: reducedMotion ? 0 : 300 });
  };
}

// Card: how many stores had it at each reading this week, and the best hour to look once there's enough data.
function trend() {
  const el = $("trend");
  const lines = Object.values(history?.stores || {});
  const length = lines[0]?.length || 0;
  const first = Math.max(0, length - WEEK);
  // Only once there's a full week: a few hours of readings is just a squiggle.
  if (length < WEEK) return (el.hidden = true);
  const counts = [];
  for (let i = first; i < length; i++) {
    const n = lines.reduce((sum, line) => sum + has(line[i]), 0);
    counts.push(lines.some((line) => line[i] !== "-") ? n : null);
  }
  const max = Math.max(1, ...counts.filter((n) => n !== null));
  const points = counts.map((n, i) => n === null ? null :
    `${(100 * i / Math.max(1, counts.length - 1)).toFixed(2)},${(34 - 30 * n / max).toFixed(1)}`).filter(Boolean);
  const byHour = Array.from({ length: 24 }, () => [0, 0]);
  counts.forEach((n, i) => { if (n !== null) { const h = london(slotDate(first + i)).hour; byHour[h][0] += n; byHour[h][1]++; } });
  const hour = byHour.map(([sum, k], h) => [k ? sum / k : -1, h]).sort((a, b) => b[0] - a[0])[0][1];
  const best = ` Best time to look: around ${hour % 12 || 12}${hour < 12 ? "am" : "pm"}.`;
  el.innerHTML = `<svg viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${points.join(" ")}" fill="none" stroke="var(--magenta)" stroke-width="2.5"
      vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <p>Stores with it, last 7 days.${best}</p>`;
  el.hidden = false;
}

async function load() {
  try {
    const [stock, past] = await Promise.all([
      fetch("stock.json?t=" + Date.now()).then((r) => r.json()),
      fetch("history.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    data = stock;
    history = past;
    render();
    trend();
  } catch (error) {
    $("headline").textContent = "Couldn't load stock. Trying again shortly.";
  }
}

// Recolour the Mapbox base style to the tub: cream land, pink-tinted water, quiet labels.
function theme() {
  for (const layer of map.getStyle().layers) {
    if (layer.type === "background") map.setPaintProperty(layer.id, "background-color", css("land"));
    else if (layer.id.startsWith("land") && layer.type === "fill") map.setPaintProperty(layer.id, "fill-color", css("land"));
    else if (layer.id.includes("water") && layer.type === "fill") map.setPaintProperty(layer.id, "fill-color", css("water"));
    else if (layer.type === "symbol" && layer.id.startsWith("poi")) map.setLayoutProperty(layer.id, "visibility", "none");
  }
}

mapboxgl.accessToken = MAPBOX_TOKEN;
// Light/dark: the viewer's pick (saved), else their system setting. The map swaps between Mapbox's two base styles.
const STYLE = { light: "mapbox://styles/mapbox/light-v11", dark: "mapbox://styles/mapbox/dark-v11" };
const ICON = { light: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>`, dark: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>` };
const mode = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function showMode() {
  const m = mode();
  $("mode").innerHTML = ICON[m];
  $("mode").setAttribute("aria-label", m === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
showMode();
$("mode").addEventListener("click", () => {
  const next = mode() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  track("theme_toggled", { mode: next });
  showMode();
  if (!mapReady) return;
  map.setStyle(STYLE[next]);
  // Base styles drop our layers; recolour and re-add them once the new style is in.
  map.once("style.load", () => { theme(); if (data) render(); });
});
// Where the push-in lands: Hounslow to Welling, East Finchley to Streatham, Westminster in the middle.
const CENTRAL = [[-0.4, 51.425], [0.12, 51.595]];
// Keep London clear of the card: beside it on wide screens, below it on phones.
const card = document.querySelector(".card");
const padding = () => innerWidth > 720
  ? { top: 20, bottom: 20, left: card.offsetWidth + 40, right: 20 }
  : { top: card.offsetHeight + 24, bottom: 20, left: 10, right: 10 };
const map = new mapboxgl.Map({
  container: "map", style: STYLE[mode()],
  bounds: CENTRAL, attributionControl: false,
});
// No zoom buttons: pinch, scroll and double-tap still zoom. Map credits (required by Mapbox) sit behind the ⓘ icon.
map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-right");
// The card shows stock even if the map fails; dots are added once the map is ready.
map.on("load", () => {
  theme();
  mapReady = true;
  if (data) render();
  // Wide screens centre on the whole window with the card floating over the west; phones keep London below the card.
  const target = map.cameraForBounds(CENTRAL, { padding: innerWidth > 720 ? 0 : padding() });
  if (reducedMotion) return map.jumpTo(target);
  // A gentle push-in: start slightly zoomed out, ease straight in without the fly-to arc.
  map.jumpTo({ ...target, zoom: target.zoom - 0.8 });
  map.easeTo({ ...target, duration: 1800, easing: (t) => 1 - Math.pow(1 - t, 3) });
});
load();
setInterval(load, 5 * 60 * 1000);
setInterval(() => data && render(), 60 * 1000);
</script>
</body>

[project]
name = "ms-pudding-map"
version = "0.1.0"
description = "Map of UK M&S stores showing whether one food product is in stock."
requires-python = ">=3.12"
dependencies = ["playwright>=1.48,<2"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
